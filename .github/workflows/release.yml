name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: osint-recon.exe
            artifact_name: osint-recon-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: osint-recon
            artifact_name: osint-recon-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: osint-recon
            artifact_name: osint-recon-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" .
          Compress-Archive -Path "${{ matrix.bin }}", "README.md", "LICENSE" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package (Unix tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" .
          tar -czvf "${{ matrix.artifact_name }}" "${{ matrix.bin }}" README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate sha256 checksums
        run: |
          cd dist
          mv */*.zip */*.tar.gz .
          rmdir */ || true
          sha256sum *.zip *.tar.gz > checksums-sha256.txt
          ls -la

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
