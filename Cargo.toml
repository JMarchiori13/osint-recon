[package]
name = "osint-recon"
version = "0.4.0"
edition = "2021"
description = "Passive OSINT reconnaissance framework for authorized red team engagements"
license = "MIT"
repository = "https://github.com/JMarchiori13/osint-recon"
homepage = "https://github.com/JMarchiori13/osint-recon"
readme = "README.md"
keywords = ["osint", "recon", "redteam", "security", "reconnaissance"]
categories = ["command-line-utilities", "os"]
exclude = ["docs/assets/", ".github/"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
lopdf = "0.34"
